[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-extract-mcp"
version = "0.3.0"
description = "MCP server: extract tables from digital PDF invoices/bank statements to CSV/JSON/Excel with PII redaction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.2.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
]

[project.scripts]
pdf-extract-mcp = "pdf_extract_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
